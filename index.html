<style>
:root{
  --cream:#F2EAE0;
  --cream-2:#FBF6F1;
  --ink:#3B2D28;
  --ink-2:#6F5B51;
  --brown:#7A6156;
  --line:#DCCFC3;
  --accent:#3B2D28;
  --radius:16px;
  --shadow:0 1px 2px rgba(59,45,40,.06), 0 8px 24px rgba(59,45,40,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.45;
  min-height:100svh;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
}
.shell{
  max-width:520px;margin:0 auto;min-height:100svh;
  display:flex;flex-direction:column;
  background:var(--cream);
}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:rgba(242,234,224,.92);
  backdrop-filter:saturate(1.2) blur(8px);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  display:flex;align-items:center;gap:12px;
  border-bottom:1px solid transparent;
  transition:border-color .2s;
}
header.scrolled{border-bottom-color:var(--line)}
.iconbtn{
  width:40px;height:40px;flex:0 0 40px;border:0;border-radius:50%;
  background:transparent;color:var(--ink);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
}
.iconbtn:active{background:rgba(59,45,40,.07)}
.iconbtn[hidden]{display:none}
.progress{flex:1;height:4px;border-radius:99px;background:var(--line);overflow:hidden}
.progress > i{display:block;height:100%;width:0;background:var(--ink);border-radius:99px;transition:width .35s cubic-bezier(.4,0,.2,1)}
.lang{display:flex;gap:2px;background:rgba(59,45,40,.06);border-radius:99px;padding:3px}
.lang button{
  border:0;background:transparent;color:var(--ink-2);
  font:600 12px/1 Inter,sans-serif;letter-spacing:.06em;
  padding:7px 9px;border-radius:99px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.lang button[aria-pressed="true"]{background:var(--cream-2);color:var(--ink);box-shadow:0 1px 2px rgba(59,45,40,.12)}

/* ---------- layout ---------- */
main{flex:1;padding:8px 16px 24px;display:flex;flex-direction:column}
.screen{animation:in .32s cubic-bezier(.22,.8,.3,1) both;display:flex;flex-direction:column;flex:1}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}}
.step-label{font:500 12px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--brown);margin:14px 0 10px}
h1{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:30px;text-wrap:balance;line-height:1.15;margin:0 0 8px;letter-spacing:-.01em}
h2{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:25px;line-height:1.2;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--ink-2);font-size:15px;margin:0 0 18px}
.hint{color:var(--brown);font-size:13px;margin:2px 0 16px}

/* ---------- options ---------- */
.opts{display:flex;flex-direction:column;gap:10px;margin:0 0 8px}
.opt{
  width:100%;min-height:58px;text-align:left;
  display:flex;align-items:center;gap:12px;
  padding:15px 16px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--cream-2);color:var(--ink);
  font:500 16px/1.3 Inter,sans-serif;cursor:pointer;
  transition:transform .12s ease, border-color .15s, background .15s, box-shadow .15s;
  -webkit-tap-highlight-color:transparent;
}
.opt:active{transform:scale(.985)}
.opt .mark{
  width:22px;height:22px;flex:0 0 22px;border:1.5px solid var(--line);
  border-radius:50%;background:var(--cream-2);
  display:flex;align-items:center;justify-content:center;transition:.15s;
}
.opt.multi .mark{border-radius:7px}
.opt .mark svg{width:13px;height:13px;opacity:0;transform:scale(.6);transition:.15s;color:var(--cream-2)}
.opt[aria-pressed="true"]{border-color:var(--ink);background:#fff;box-shadow:var(--shadow)}
.opt[aria-pressed="true"] .mark{background:var(--ink);border-color:var(--ink)}
.opt[aria-pressed="true"] .mark svg{opacity:1;transform:none}

/* ---------- fields ---------- */
.field{margin:0 0 14px}
.field label{display:block;font:500 13px/1 Inter,sans-serif;color:var(--ink-2);margin:0 0 7px}
.field .opt-note{margin-top:10px}
input[type=text],input[type=email],input[type=tel]{
  width:100%;height:54px;padding:0 15px;font-size:16px;color:var(--ink);
  background:var(--cream-2);border:1px solid var(--line);border-radius:14px;
  font-family:inherit;
}
input:focus{outline:none;border-color:var(--ink);background:#fff}
input::placeholder{color:#B6A79B}
.ig-wrap{display:flex;align-items:center;background:var(--cream-2);border:1px solid var(--line);border-radius:14px;transition:.15s}
.ig-wrap:focus-within{border-color:var(--ink);background:#fff}
.ig-wrap span{padding:0 2px 0 15px;color:var(--brown);font-size:16px}
.ig-wrap input{border:0;background:transparent;padding-left:2px}
.ig-wrap input:focus{background:transparent}
.opt-tag{font-size:12px;color:var(--brown);font-weight:400}

/* ---------- footer / buttons ---------- */
.foot{
  position:sticky;bottom:0;z-index:15;margin-top:auto;
  padding:12px 0 calc(env(safe-area-inset-bottom) + 12px);
  background:linear-gradient(to top,var(--cream) 68%,rgba(242,234,224,0));
}
.btn{
  width:100%;min-height:56px;border:0;border-radius:99px;
  background:var(--ink);color:var(--cream);
  font:600 16px/1 Inter,sans-serif;letter-spacing:.01em;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:9px;
  transition:transform .12s ease,opacity .15s;
  -webkit-tap-highlight-color:transparent;
}
.btn:active{transform:scale(.985)}
a.btn{text-decoration:none}
.btn[disabled]{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--ink-2);min-height:46px;font-weight:500;font-size:14px}
.legal{font-size:12px;color:var(--brown);text-align:center;margin:12px 4px 0;line-height:1.45}
.fhint{margin:7px 2px 0;font-size:12px;line-height:1.4;color:var(--brown)}
.hp{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
.err{background:#F6E2DC;border:1px solid #E0BCB0;color:#7A3B2A;border-radius:12px;padding:12px 14px;font-size:14px;margin:0 0 12px}

/* ---------- intro ---------- */
.intro{align-items:center;justify-content:center;text-align:center;padding-top:2vh}
.intro .logo{width:min(230px,62%);margin:auto auto 4px;display:block}
.intro h1{font-size:32px;margin-top:10px;line-height:1.1}
.intro .sub{font-size:16px;max-width:330px;margin-inline:auto}
.meta{display:flex;gap:18px;justify-content:center;color:var(--brown);font-size:13px;margin:2px 0 26px}
.meta span{display:flex;align-items:center;gap:6px}
.rule{width:44px;height:1px;background:var(--line);margin:18px auto}

/* ---------- summary / thanks ---------- */
.thanks{align-items:center;justify-content:center;text-align:center;flex:1}
.spark{font-size:40px;line-height:1;margin:auto auto 14px}
.card{background:var(--cream-2);border:1px solid var(--line);border-radius:var(--radius);padding:4px 16px;margin:6px 0 0;text-align:left}
.card .row{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.card .row:last-child{border-bottom:0}
.card .row b{flex:0 0 34%;font-weight:500;color:var(--brown)}
.card .row span{flex:1;color:var(--ink)}
.spin{width:18px;height:18px;border:2px solid rgba(242,234,224,.35);border-top-color:var(--cream);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

               ru:"Мы посмотрим Ваши ответы и поможем Вам найти подходящую школу или тренера.",
               en:"We will go through your answers and help you find the right school or teacher."},

               ru:"Ответим в течение 24–48 часов в Instagram.",
               en:"We will get back to you on Instagram within 24–48h."},

const t = k => (T[k] && (T[k][lang] || T[k].sr)) || "";
const L = o => (o && (o[lang] || o.sr)) || "";

/* ---------------- pitanja ---------------- */
const O = (sr, ru, en, extra) => Object.assign({sr, ru, en}, extra || {});
const QUESTIONS = [
  {
    key:"direction", col:"Direction", multi:false,
    title:{sr:"Koji ples Vas zanima?", ru:"Какое направление Вас интересует?", en:"Which dance are you interested in?"},
    options:[
      O("Latino (Latin)","Латина (Latin)","Latin"),
      O("Standard","Стандарт (Standard)","Standard (Ballroom)"),
      O("Salsa / Bachata","Сальса / Бачата","Salsa / Bachata"),

  },

    title:{sr:"Vaš nivo?", ru:"Ваш уровень?", en:"Your level?"},
    options:[

  },

  },

    options:[

      O("Cena","Цена","Price"),

    ]

];
const LAST = QUESTIONS.length;      // indeks contact ekrana
const TOTAL = QUESTIONS.length + 1; // pitanja + kontakt

/* ---------------- state ---------------- */
let lang = detectLang();

// ?lang=en u linku ima prednost (zgodno za stories na engleskom), pa zapamćen izbor, pa jezik telefona
function detectLang(){
  const q = (new URLSearchParams(location.search).get("lang") || "").toLowerCase();
  if (["sr","ru","en"].indexOf(q) > -1) return q;
  const saved = localStorage.getItem("psp_lang");
  if (["sr","ru","en"].indexOf(saved) > -1) return saved;
  const nav = (navigator.language || "").toLowerCase();
  if (nav.indexOf("ru") === 0) return "ru";
  if (nav.indexOf("en") === 0) return "en";
  return "sr";
}
let step = -1;                 // -1 intro, 0..N-1 pitanja, N kontakt, N+1 hvala
let answers = {};              // key -> string | string[]
let otherText = "";
let contact = {name:"", ig:"", email:"", phone:""};
let sending = false, sendError = false;
let hp = "";                   // honeypot — ostaje prazan kod ljudi
let maxStep = -1;              // najdalje dokle je korisnik stigao (za statistiku)
let kucao = false, spreman = false;   // da li je počeo da kuca kontakt i da li ga je popunio
let igPremesten = false;              // upisali su email u polje za Instagram
let startedAt = 0;             // kada je korisnik krenuo sa popunjavanjem

const view = document.getElementById("view");
const back = document.getElementById("back");
const prog = document.getElementById("prog");
const spacer = document.getElementById("spacer");
const hdr = document.getElementById("hdr");

const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------------- render ---------------- */
function render(){
  document.documentElement.lang = lang;
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));

  const showChrome = step >= 0 && step <= LAST;
  back.hidden = !showChrome;
  prog.hidden = !showChrome;
  spacer.hidden = showChrome;
  if (showChrome) prog.firstElementChild.style.width = ((step + 1) / TOTAL * 100) + "%";

  if (step === -1) view.innerHTML = introHTML();
  else if (step < LAST) view.innerHTML = questionHTML(QUESTIONS[step], step);
  else if (step === LAST) view.innerHTML = contactHTML();
  else view.innerHTML = thanksHTML();

  wire();
  window.scrollTo(0, 0);
}

function introHTML(){

    <h1>${t("brand").replace(/ ([^ ]*)$/, "&nbsp;$1")}&nbsp;<span aria-hidden="true">✨</span></h1>
    <p class="sub">${esc(t("introSub"))}</p>

function questionHTML(q, i){
  const val = answers[q.key];
  const sel = v => q.multi ? (Array.isArray(val) && val.indexOf(v) > -1) : val === v;
  const opts = q.options.map(o => {
    const v = o.sr;
    return `<button type="button" class="opt${q.multi ? " multi" : ""}" data-val="${esc(v)}"
      aria-pressed="${sel(v)}"><span class="mark">${CHECK}</span><span>${esc(L(o))}</span></button>`;
  }).join("");

  const other = q.options.some(o => o.other && sel(o.sr))
    ? `<div class="field opt-note"><input type="text" id="otherText" placeholder="${esc(t("otherPh"))}" value="${esc(otherText)}" autocomplete="off"></div>`
    : "";

  const needsFoot = q.multi || other;
  const canGo = q.multi ? (Array.isArray(val) && val.length > 0) : !!val;

  return `<section class="screen" data-q="${q.key}">
    <div class="step-label">${esc(t("step"))} ${i + 1} ${esc(t("of"))} ${TOTAL}</div>
    <h2>${esc(L(q.title))}</h2>
    ${q.multi ? `<p class="hint">${esc(t("multiHint"))}</p>` : `<div style="height:8px"></div>`}
    <div class="opts">${opts}</div>
    ${other}
    ${needsFoot ? `<div class="foot"><button class="btn" data-act="next" ${canGo ? "" : "disabled"}>${esc(t("next"))}</button></div>` : ""}
  </section>`;
}

// dovoljno je ime i JEDAN način da im se javimo
function kontaktSpreman(){
  const email = contact.email.trim();
  return contact.name.trim().length >= 2 && !!(
    contact.ig.trim() ||
    (email.indexOf("@") > 0 && email.indexOf(".") > email.indexOf("@")) ||
    contact.phone.replace(/\D/g, "").length >= 6
  );
}

/* ---------------- interakcije ---------------- */
function wire(){
  view.querySelectorAll(".opt").forEach(btn => {
    btn.addEventListener("click", () => onOption(btn));
  });
  const act = view.querySelector("[data-act]");
  view.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => {
    const a = b.dataset.act;
    if (a === "start") go(0);
    else if (a === "next") go(step + 1);
    else if (a === "send") submit();
  }));
  const ot = view.querySelector("#otherText");
  if (ot) ot.addEventListener("input", e => { otherText = e.target.value; });

  const hpEl = view.querySelector("#f_website");
  if (hpEl) hpEl.addEventListener("input", e => { hp = e.target.value; });

  ["name","ig","email","phone"].forEach(k => {
    const el = view.querySelector("#f_" + k);
    if (!el) return;
    el.addEventListener("input", e => {
      let v = e.target.value;
      if (k === "ig"){
        v = normIg(v);
        if (v !== e.target.value) e.target.value = v;   // nalepljen link → čist handle
      }
      contact[k] = v;
      if (!kucao) { kucao = true; track("contact_typing"); }
      const popunjeno = kontaktSpreman();
      if (popunjeno && !spreman) { spreman = true; track("contact_ready"); }
      const sendBtn = view.querySelector('[data-act="send"]');
      if (sendBtn) sendBtn.disabled = !popunjeno || sending;
    });
    el.addEventListener("keydown", e => { if (e.key === "Enter") e.target.blur(); });
    if (k === "ig") el.addEventListener("blur", () => {
      const v = contact.ig.trim();
      if (v.indexOf("@") > 0 && v.indexOf(".") > v.indexOf("@")){   // ovo je email, ne handle
        if (!contact.email.trim()) contact.email = v;
        contact.ig = "";
        igPremesten = true;
        render();
      }
    });
  });
  if (act) act.blur();
}

function onOption(btn){
  const q = QUESTIONS[step];
  const v = btn.dataset.val;
  const opt = q.options.find(o => o.sr === v);

  if (q.multi){
    let arr = Array.isArray(answers[q.key]) ? answers[q.key].slice() : [];
    const excl = q.options.filter(o => o.exclusive).map(o => o.sr);
    if (opt.exclusive){
      arr = arr.indexOf(v) > -1 ? [] : [v];
    } else {
      arr = arr.filter(x => excl.indexOf(x) === -1);
      const i = arr.indexOf(v);
      if (i > -1) arr.splice(i, 1); else arr.push(v);
    }
    answers[q.key] = arr;
    // menjamo samo stanje dugmadi — bez ponovnog crtanja ekrana (da lista ne "trepće")
    view.querySelectorAll(".opt").forEach(b => b.setAttribute("aria-pressed", String(arr.indexOf(b.dataset.val) > -1)));
    const nb = view.querySelector('[data-act="next"]');
    if (nb) nb.disabled = arr.length === 0;
    saveDraft();
    return;
  }

  answers[q.key] = v;
  if (opt.other){ render(); return; }        // "Drugo" → traži tekst
  if (q.options.some(o => o.other) ) otherText = "";
  btn.setAttribute("aria-pressed", "true");
  view.querySelectorAll(".opt").forEach(b => { if (b !== btn) b.setAttribute("aria-pressed", "false"); });
  setTimeout(() => go(step + 1), 230);        // auto-dalje
}

function go(n){
  if (n === 0 && !startedAt) { startedAt = Date.now(); track("start"); }
  step = Math.max(-1, Math.min(LAST + 1, n));
  if (step > maxStep && step <= LAST) maxStep = step;
  saveDraft();
  render();
  if (step >= 0 && step <= LAST) history.pushState({step}, "");
}
window.addEventListener("popstate", e => {
  if (step > -1 && step <= LAST){ step = Math.max(-1, step - 1); render(); }
});
back.addEventListener("click", () => { if (step > -1 && step <= LAST) history.back(); });
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  localStorage.setItem("psp_lang", lang);
  render();
}));
window.addEventListener("scroll", () => hdr.classList.toggle("scrolled", window.scrollY > 4), {passive:true});

/* ---------------- draft (da se ne izgubi kod slučajnog reload-a) ---------------- */
function saveDraft(){
  try { localStorage.setItem("psp_draft", JSON.stringify({step, answers, otherText, contact, startedAt, ts:Date.now()})); } catch(e){}
}
(function loadDraft(){
  try {
    const d = JSON.parse(localStorage.getItem("psp_draft") || "null");
    if (d && Date.now() - d.ts < 36e5 && d.step > -1 && d.step <= LAST){
      answers = d.answers || {}; otherText = d.otherText || ""; contact = d.contact || contact;
      startedAt = d.startedAt || 0;
    }
  } catch(e){}
})();

/* ---------------- statistika (anonimno) ----------------
   Šaljemo samo: šta se desilo, kada, na kom koraku, koji jezik i odakle je link.
   Nema imena, nema IP adrese, nema kolačića — nasumičan broj koji živi
   dok je tab otvoren i nestaje kad se zatvori. */

const SESSION = (function () {
  try {
    var v = sessionStorage.getItem("psp_sid");
    if (!v) { v = Math.random().toString(36).slice(2, 10); sessionStorage.setItem("psp_sid", v); }
    return v;
  } catch (e) { return Math.random().toString(36).slice(2, 10); }
})();

const SRC = new URLSearchParams(location.search).get("src") || "instagram";

function track(event, korak){
  if (!CONFIG.ENDPOINT) return;
  const body = JSON.stringify({
    kind: "event", token: CONFIG.TOKEN, session: SESSION,
    event: event, step: (korak === undefined ? "" : korak),
    language: lang.toUpperCase(), source: SRC
  });
  try {
    // sendBeacon prolazi i kad se stranica zatvara; fetch je rezerva
    if (navigator.sendBeacon &&
        navigator.sendBeacon(CONFIG.ENDPOINT, new Blob([body], {type:"text/plain;charset=utf-8"}))) return;
    fetch(CONFIG.ENDPOINT, {method:"POST", mode:"no-cors", keepalive:true,
      headers:{"Content-Type":"text/plain;charset=utf-8"}, body:body});
  } catch (e){}
}

// jedan "odlazak" po sesiji — govori nam do kog pitanja su ljudi stigli pre nego što odustanu
let exitSent = false;
function trackExit(){
  if (exitSent) return;
  exitSent = true;
  track("exit", maxStep);
}
window.addEventListener("pagehide", trackExit);
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "hidden") trackExit();
});

/* ---------------- slanje ---------------- */
// "@ana", "instagram.com/ana/", "https://www.instagram.com/ana?igsh=..." → "ana"
function normIg(v){
  return String(v || "").trim()
    .replace(/^@+/, "")
    .replace(/^https?:\/\//i, "")
    .replace(/^(www\.)?instagram\.com\//i, "")
    .replace(/[?#].*$/, "")
    .replace(/\/+$/, "")
    .replace(/\s+/g, "");
}

function directionValue(){
  const v = answers.direction || "";
  return (v === "Drugo" && otherText.trim()) ? "Drugo: " + otherText.trim() : v;
}
function payload(){
  const j = k => Array.isArray(answers[k]) ? answers[k].join(", ") : (answers[k] || "");
  return {
    name: contact.name.trim(),
    ig: normIg(contact.ig) ? "@" + normIg(contact.ig) : "",
    email: contact.email.trim(),
    phone: contact.phone.trim(),
    language: lang.toUpperCase(),
    direction: directionValue(),
    format: j("format"),
    level: j("level"),
    goal: j("goal"),
    location: j("location"),
    time: j("time"),
    frequency: j("frequency"),
    priorities: j("priorities"),
    source: (new URLSearchParams(location.search).get("src") || "instagram"),
    token: CONFIG.TOKEN,
    hp: hp,                                                    // popunjeno = bot
    elapsed: startedAt ? Math.round((Date.now() - startedAt) / 1000) : 0
  };
}

async function submit(){
  if (sending) return;
  sending = true; sendError = false; render();
  const body = JSON.stringify(payload());

  if (!CONFIG.ENDPOINT){
    console.warn("[PSP] CONFIG.ENDPOINT nije podešen — podaci nisu poslati:", body);
    finish(); return;
  }
  try { localStorage.setItem("psp_last", body); } catch (e){}   // kopija, za svaki slučaj

  try {
    await post(body);
    finish();
  } catch (err){
    await sleep(900);
    try {                                     // drugi pokušaj
      await post(body);
      finish();
    } catch (err2){
      try { postViaForm(body); finish(); }    // rezerva za in-app browser-e (Instagram/TikTok)
      catch (e3){ sending = false; sendError = true; track("send_fail"); render(); }
    }
  }
}

function post(body){
  return fetch(CONFIG.ENDPOINT, {
    method:"POST", mode:"no-cors", redirect:"follow",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body
  });
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

// Rezervni put: klasičan form POST u skriveni iframe (bez CORS-a).
function postViaForm(body){
  const f = document.createElement("form");
  const i = document.createElement("iframe");
  i.name = "psp_sink"; i.style.display = "none";
  f.method = "POST"; f.action = CONFIG.ENDPOINT; f.target = "psp_sink"; f.style.display = "none";
  const inp = document.createElement("input");
  inp.type = "hidden"; inp.name = "payload"; inp.value = body;
  f.appendChild(inp);
  document.body.appendChild(i); document.body.appendChild(f);
  f.submit();
}

function finish(){
  sending = false;
  exitSent = true;                 // poslato je "submit", "exit" više nije potreban
  track("submit", LAST);
  try { localStorage.removeItem("psp_draft"); } catch(e){}
  step = LAST + 1;
  render();
}

render();
track("view");
</script>
